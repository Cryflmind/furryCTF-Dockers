<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background-color: white; padding: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .user-info { background-color: #f9f9f9; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .error { color: red; padding: 15px; background-color: #ffeeee; border-radius: 5px; }
        .flag { margin-top: 15px; padding: 10px; background-color: #e6f7ff; border-left: 4px solid #1890ff; white-space: pre-line; }
    </style>
</head>
<body>
<div class="container">
    <h1>用户主页</h1>
    <div id="content">
        <p>正在验证您的访问权限...</p>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('key');

    fetch('validate.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token })
    })
        .then(response => response.json())  // 无论状态码都尝试解析 json
        .then(data => {
            const contentDiv = document.getElementById('content');

            if (data.stat === 200) {
                let html = `
            <div class="user-info">
                <h2>欢迎, ${data.user}!</h2>
                <p>登录时间: ${new Date(data.iat * 1000).toLocaleString()}</p>
                <p>过期时间: ${new Date(data.exp * 1000).toLocaleString()}</p>`;

                if (data.flag) {
                    html += `<div class="flag">flag:\n${data.flag}</div>`;
                }

                html += `</div><p>您已成功通过身份验证。</p>`;
                contentDiv.innerHTML = html;
            } else {
                contentDiv.innerHTML = `
            <div class="error">
                <h2>访问被拒绝</h2>
                <p>原因: ${data.message}</p>
                <p>请<a href="../login.html">重新登录</a></p>
            </div>`;
            }
        })
        .catch(error => {
            document.getElementById('content').innerHTML = `
        <div class="error">
            <h2>发生错误</h2>
            <p>${error.message}</p>
            <p>请检查浏览器控制台获取详细信息</p>
        </div>`;
            console.error('验证错误:', error);
        });
</script>
</body>
</html>
