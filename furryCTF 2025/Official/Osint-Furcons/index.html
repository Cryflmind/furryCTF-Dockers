<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兽·聚 - 地点解锁挑战</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .warning {
            color: red;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 30px 0;
        }
        .image-container {
            position: relative;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            transition: all 0.3s;
            background-color: white;
        }
        .image-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .image-container img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            cursor: pointer;
        }
        .lock-icon {
            font-size: 24px;
            margin-top: 10px;
            color: #ff4757;
        }
        .unlocked {
            color: #2ed573;
        }
        .input-container {
            margin-top: 10px;
        }
        .input-field {
            padding: 8px;
            width: 80%;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 5px;
        }
        .submit-btn {
            padding: 8px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .submit-btn:hover {
            background-color: #2980b9;
        }
        .progress {
            margin-top: 30px;
            font-size: 18px;
            font-weight: bold;
        }
        .flag-container {
            margin-top: 20px;
            padding: 15px;
            background-color: #f1f2f6;
            border-radius: 5px;
            display: none;
        }
        .flag {
            font-family: monospace;
            font-size: 16px;
            color: #e84118;
        }
        .hidden {
            display: none;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            overflow: auto;
        }
        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
            margin-top: 50px;
        }
        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h1>兽·聚</h1>
<p class="subtitle">点击图片放大查看，输入正确的兽聚举办地址（以百度地图为准）解锁图片</p>
<p class="warning">Warning：本题不会存储您的答题进度，所以请不要关闭此页面，否则您可能需要从头开始！</p>

<div class="image-grid">
    <!-- 图片1 -->
    <div class="image-container" data-id="1">
        <img src="img/1.jpg" alt="图片1" onclick="openModal(this)">
        <div class="lock-icon" id="lock-1">🔒</div>
        <div class="input-container" id="input-container-1">
            <input type="text" class="input-field" id="input-1" placeholder="输入地址...">
            <button class="submit-btn" onclick="submitAnswer(1)">提交</button>
        </div>
    </div>

    <!-- 图片2 -->
    <div class="image-container" data-id="2">
        <img src="img/2.jpg" alt="图片2" onclick="openModal(this)">
        <div class="lock-icon" id="lock-2">🔒</div>
        <div class="input-container" id="input-container-2">
            <input type="text" class="input-field" id="input-2" placeholder="输入地址...">
            <button class="submit-btn" onclick="submitAnswer(2)">提交</button>
        </div>
    </div>

    <!-- 图片3 -->
    <div class="image-container" data-id="3">
        <img src="img/3.jpg" alt="图片3" onclick="openModal(this)">
        <div class="lock-icon" id="lock-3">🔒</div>
        <div class="input-container" id="input-container-3">
            <input type="text" class="input-field" id="input-3" placeholder="输入地址...">
            <button class="submit-btn" onclick="submitAnswer(3)">提交</button>
        </div>
    </div>

    <!-- 图片4 -->
    <div class="image-container" data-id="4">
        <img src="img/4.jpg" alt="图片4" onclick="openModal(this)">
        <div class="lock-icon" id="lock-4">🔒</div>
        <div class="input-container" id="input-container-4">
            <input type="text" class="input-field" id="input-4" placeholder="输入地址...">
            <button class="submit-btn" onclick="submitAnswer(4)">提交</button>
        </div>
    </div>

    <!-- 图片5 -->
    <div class="image-container" data-id="5">
        <img src="img/5.jpg" alt="图片5" onclick="openModal(this)">
        <div class="lock-icon" id="lock-5">🔒</div>
        <div class="input-container" id="input-container-5">
            <input type="text" class="input-field" id="input-5" placeholder="输入地址...">
            <button class="submit-btn" onclick="submitAnswer(5)">提交</button>
        </div>
    </div>

    <!-- 图片6 -->
    <div class="image-container" data-id="6">
        <img src="img/6.jpg" alt="图片6" onclick="openModal(this)">
        <div class="lock-icon" id="lock-6">🔒</div>
        <div class="input-container" id="input-container-6">
            <input type="text" class="input-field" id="input-6" placeholder="输入地址...">
            <button class="submit-btn" onclick="submitAnswer(6)">提交</button>
        </div>
    </div>
</div>

<div class="progress" id="progress">已解锁: 0/6</div>
<div class="flag-container" id="flag-container">
    <p>你的flag: <span class="flag" id="flag"></span></p>
</div>

<!-- 图片预览模态框 -->
<div id="imageModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="modalImage">
</div>

<script>
    // 存储解锁状态（仅内存，不持久化）
    let unlockedImages = Array(6).fill(false);

    // 页面加载时从服务器获取状态
    window.onload = async function() {
        await loadUnlockedStatus();
    };

    // 从服务器加载解锁状态
    async function loadUnlockedStatus() {
        try {
            const response = await fetch('check.php?action=get_status');
            const data = await response.json();

            if (data.success) {
                unlockedImages = data.unlocked_status;

                // 更新UI显示
                for (let i = 0; i < unlockedImages.length; i++) {
                    if (unlockedImages[i]) {
                        document.getElementById(`lock-${i+1}`).textContent = '🔓';
                        document.getElementById(`lock-${i+1}`).classList.add('unlocked');
                        document.getElementById(`input-container-${i+1}`).classList.add('hidden');
                    }
                }

                updateProgress();
                checkAllUnlocked();
            }
        } catch (error) {
            console.error('加载状态失败:', error);
        }
    }

    // 提交答案
    async function submitAnswer(imageId) {
        if (unlockedImages[imageId-1]) return;

        const inputElement = document.getElementById(`input-${imageId}`);
        const answer = inputElement.value.trim();

        if (!answer) {
            alert('请输入地址');
            return;
        }

        try {
            const response = await fetch('check.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    action: 'verify',
                    image_id: imageId,
                    answer: answer
                })
            });

            const data = await response.json();
            if (data.success) {
                if (data.correct) {
                    unlockedImages[imageId-1] = true;
                    updateUI(imageId);
                    updateProgress();
                    checkAllUnlocked();
                } else {
                    alert('地址不正确，请重试');
                }
            }
        } catch (error) {
            console.error('请求失败:', error);
            alert('操作失败，请重试');
        }
    }

    function updateUI(imageId) {
        document.getElementById(`lock-${imageId}`).textContent = '🔓';
        document.getElementById(`lock-${imageId}`).classList.add('unlocked');
        document.getElementById(`input-container-${imageId}`).classList.add('hidden');
    }

    function updateProgress() {
        const count = unlockedImages.filter(Boolean).length;
        document.getElementById('progress').textContent = `已解锁: ${count}/6`;
    }

    async function checkAllUnlocked() {
        if (unlockedImages.every(Boolean)) {
            const response = await fetch('check.php?action=get_flag');
            const data = await response.json();
            if (data.success) {
                document.getElementById('flag').textContent = data.flag;
                document.getElementById('flag-container').style.display = 'block';
            }
        }
    }

    // 图片预览功能（保持不变）
    function openModal(imgElement) {
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        modal.style.display = "block";
        modalImg.src = imgElement.src;
    }

    function closeModal() {
        document.getElementById('imageModal').style.display = "none";
    }

    window.onclick = function(event) {
        const modal = document.getElementById('imageModal');
        if (event.target == modal) closeModal();
    }
</script>
</body>
</html>
