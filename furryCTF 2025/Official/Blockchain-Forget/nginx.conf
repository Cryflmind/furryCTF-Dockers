events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # 日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;
    
    # 性能优化
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        
        # 默认页面
        location / {
            index index.html;
            try_files $uri $uri/ =404;
        }
        
        # 合约信息（公开）
        location /info.json {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin "*";
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            alias /usr/share/nginx/html/info.json;
        }
        
        # API端点 - 特殊处理
        location /api/ {
            root /usr/share/nginx/html;
            index index.html;
            
            # 如果请求的是目录，显示index.html
            if (-d $request_filename) {
                rewrite ^(.*[^/])$ $1/ permanent;
            }
            
            try_files $uri $uri/ /api/index.html;
            
            add_header Content-Type "text/html";
            add_header Access-Control-Allow-Origin "*";
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        
        # 单独的attacker-key.json文件
        location = /api/attacker-key.json {
            alias /usr/share/nginx/html/api/attacker-key.json;
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin "*";
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        
        # 合约源码（公开）
        location /target.sol {
            add_header Content-Type text/plain;
            add_header Access-Control-Allow-Origin "*";
            alias /usr/share/nginx/html/target.sol;
        }
        
        # RPC代理
        location /rpc/ {
            proxy_pass http://localhost:8545/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # 增加超时时间
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # CORS头
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
            
            # 处理预检请求
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }
        }
        
        # 禁止访问敏感文件
        location ~ /\. {
            deny all;
        }
        
        # 错误页面
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
        
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
        }
    }
}