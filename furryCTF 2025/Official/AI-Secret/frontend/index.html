<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>与 白风 聊天</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1><i class="fas fa-robot"></i> 与 白风 聊天</h1>
            <p>与猫猫进行对话，每次只能发送一条消息，等待回复后才能发送下一条</p>
        </div>
        
        <div class="system-info">
            系统状态: <span id="status">已连接</span> | 用户ID: <span id="user-id">default</span>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message assistant-message">
                <div class="message-content">
                    您好哦，这里是白风nwn~好久不见~
                </div>
                <div class="message-time">白风 · 刚刚</div>
            </div>
        </div>
        
        <div class="controls">
            <div class="chat-input-area">
                <input type="text" 
                       class="chat-input" 
                       id="message-input" 
                       placeholder="输入您想说的话..." 
                       autocomplete="off">
                <button class="send-button" id="send-button">
                    <i class="fas fa-paper-plane"></i> 发送
                </button>
            </div>
            <button class="reset-button" id="reset-button">
                <i class="fas fa-trash-alt"></i> 重置对话
            </button>
        </div>
        
        <div class="footer-info">
            使用DeepSeek API | 每次只能发送一条消息，等待回复后才能发送下一条
        </div>
    </div>

    <script>
        // 配置
        const API_URL = '/api';
        const USER_ID = 'user_' + Math.random().toString(36).substring(2, 9);
        
        // 状态管理
        let isWaitingForResponse = false;
        let messageHistory = [];
        
        // DOM元素
        const chatMessages = document.getElementById('chat-messages');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const resetButton = document.getElementById('reset-button');
        const statusElement = document.getElementById('status');
        const userIdElement = document.getElementById('user-id');
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            userIdElement.textContent = USER_ID;
            checkBackendHealth();
            
            // 添加初始消息到历史
            messageHistory.push({
                role: 'assistant',
                content: '您好哦，这里是白风nwn~好久不见~'
            });
        });
        
        // 检查后端健康状态
        async function checkBackendHealth() {
            try {
                const response = await fetch(`${API_URL}/health`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.status === 'healthy') {
                        statusElement.textContent = '已连接';
                        statusElement.style.color = '#28a745';
                        
                        // 显示API状态
                        if (!data.api_key_set) {
                            showSystemMessage('警告: 未设置DeepSeek API密钥，对话功能将无法使用');
                        }
                    }
                } else {
                    throw new Error('后端服务异常');
                }
            } catch (error) {
                statusElement.textContent = '连接失败';
                statusElement.style.color = '#dc3545';
                showSystemMessage('无法连接到后端服务，请检查网络连接或稍后重试');
                console.error('后端连接失败:', error);
            }
        }
        
        // 显示系统消息
        function showSystemMessage(message) {
            const messageElement = document.createElement('div');
            messageElement.className = 'message system-message';
            messageElement.innerHTML = `
                <div class="message-content">
                    <i class="fas fa-info-circle"></i> ${message}
                </div>
                <div class="message-time">白风 · 刚刚</div>
            `;
            
            // 添加到消息列表开头
            chatMessages.insertBefore(messageElement, chatMessages.firstChild);
        }
        
        // 发送消息
        async function sendMessage() {
            if (isWaitingForResponse) {
                alert('请等待猫猫回复后再发送下一条消息');
                return;
            }
            
            const message = messageInput.value.trim();
            if (!message) return;
            
            // 添加用户消息到界面
            addMessageToUI(message, 'user');
            messageInput.value = '';
            
            // 显示思考中指示器
            showThinkingIndicator();
            isWaitingForResponse = true;
            sendButton.disabled = true;
            messageInput.disabled = true;
            
            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        user_id: USER_ID
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP错误! 状态码: ${response.status}`);
                }
                
                const data = await response.json();
                
                // 移除思考中指示器
                removeThinkingIndicator();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                // 添加AI回复到界面
                addMessageToUI(data.response, 'assistant');
                
                // 更新历史记录
                messageHistory = data.history || [];
                
            } catch (error) {
                console.error('发送消息时出错:', error);
                removeThinkingIndicator();
                addMessageToUI(`抱歉，出现错误: ${error.message}`, 'assistant');
            } finally {
                isWaitingForResponse = false;
                sendButton.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }
        
        // 重置对话
        async function resetConversation() {
            if (!confirm('确定要重置对话吗？这将清除所有对话历史。')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/reset`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: USER_ID
                    })
                });
                
                if (response.ok) {
                    // 清空界面
                    chatMessages.innerHTML = `
                        <div class="message assistant-message">
                            <div class="message-content">
                                对话已重置！咦，好久不见~
                            </div>
                            <div class="message-time">白风 · 刚刚</div>
                        </div>
                    `;
                    
                    // 重置历史
                    messageHistory = [{
                        role: 'assistant',
                        content: '对话已重置！咦，好久不见~'
                    }];
                }
            } catch (error) {
                console.error('重置对话时出错:', error);
                alert('重置对话失败，请稍后重试');
            }
        }
        
        // 添加消息到界面
        function addMessageToUI(message, sender) {
            const messageElement = document.createElement('div');
            messageElement.className = `message ${sender}-message`;
            
            const now = new Date();
            const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            messageElement.innerHTML = `
                <div class="message-content">${escapeHtml(message)}</div>
                <div class="message-time">${sender === 'user' ? '您' : '白风'} · ${timeString}</div>
            `;
            
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // 显示思考中指示器
        function showThinkingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'thinking-indicator';
            indicator.id = 'thinking-indicator';
            indicator.textContent = '猫猫正在思考';
            chatMessages.appendChild(indicator);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // 移除思考中指示器
        function removeThinkingIndicator() {
            const indicator = document.getElementById('thinking-indicator');
            if (indicator) {
                indicator.remove();
            }
        }
        
        // HTML转义函数
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 事件监听
        sendButton.addEventListener('click', sendMessage);
        resetButton.addEventListener('click', resetConversation);
        
        messageInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
        
        // 初始化输入框焦点
        messageInput.focus();
    </script>
</body>
</html>
